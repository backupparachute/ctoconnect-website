title: CTOConnect
description: An experienced CTO when you need one. Real problems. Real answers. No bullshit.
url: "https://ctoconnect.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Booking links (Calendly)
# TODO Kyle: create the free 20-minute diagnostic call event and paste its URL here.
diagnostic_call_url: "https://calendly.com/backupparachute/REPLACE-ME-diagnostic"
# Paid 90-minute Deep Dive. Stripe payment is collected by Calendly at booking.
deep_dive_url: "https://calendly.com/backupparachute/meet-with-kyle"

# Newsletter signup endpoint.
# TODO Kyle: point this at the endpoint that adds the contact to Resend.
# Contract: POST JSON {"email": "...", "source": "<page path>"}; any 2xx response means subscribed.
newsletter_endpoint: "https://REPLACE-ME.example.com/subscribe"

# Collections
collections:
  posts:
    output: true
    permalink: /articles/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Social media
social:
  name: CTO Connect

# Author information
author:
  name: Kyle Miller
  email: kyle@ctoconnect.io
  bio: "27 years building production systems. Built and sold a SaaS. Still runs them."
  location: "United States"

title: CTOConnect
description: An experienced CTO when you need one. Real problems. Real answers. No bullshit.
url: "https://ctoconnect.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Booking links (Calendly)
# Free 20 minute diagnostic call.
diagnostic_call_url: "https://calendly.com/backupparachute/cto-connect-diagnosis"
# Paid 90 minute Deep Dive. Stripe payment is collected by Calendly at booking.
deep_dive_url: "https://calendly.com/backupparachute/meet-with-kyle"

# Secure Transmit workflow "cto-connect-contact". Both forms post JSON to it and any 2xx means success.
# Contact form:    {form: "contact", firstname, lastname, email, message, newsletter: true|false, source}
# Newsletter form: {form: "newsletter", email, newsletter: true, source}
# The workflow tells them apart by "form" and adds the contact to Resend when newsletter is true.
contact_form_url: "https://bps.securetransmit.io/forms/cto-connect-contact?token=BUZfocfq5S3sNobzQQJsiUja"
newsletter_endpoint: "https://bps.securetransmit.io/forms/cto-connect-contact?token=BUZfocfq5S3sNobzQQJsiUja"

# Collections
collections:
  posts:
    output: true
    permalink: /articles/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Social media
social:
  name: CTO Connect

# Address shown on the terms and privacy pages.
legal_email: legal@ctoconnect.io

# Author information
author:
  name: Kyle Miller
  email: kyle@ctoconnect.io
  bio: "27 years building production systems. Built and sold a SaaS. Still runs them."
  location: "United States"
